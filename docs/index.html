<style>
  :root {
    --paper:   #f5f4ef;
    --surface: #fffdf8;
    --ink:     #1b1d22;

    --line:    #e4e1d8;
    --accent:  #1f6a74;
    --accent-ink: #12474e;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:   #141619;
      --surface: #1b1e22;
      --ink:     #e9e8e2;
      --muted:   #9aa0a9;
      --faint:   #6b7079;
      --line:    #2c3036;
      --accent:  #5cb7c2;
      --accent-ink: #a7dfe5;
      --new:     #e79162;
      --new-bg:  #33241a;
      --d-fav:   #c9a668;
      --d-wie:   #77a9cd;
      --d-sim:   #93bd7c;
      --d-mar:   #cf7fa3;
    }
  }
  :root[data-theme="dark"] {
    --paper:   #141619;
    --surface: #1b1e22;
    --ink:     #e9e8e2;
    --muted:   #9aa0a9;
    --faint:   #6b7079;
    --line:    #2c3036;
    --accent:  #5cb7c2;
    --accent-ink: #a7dfe5;
    --new:     #e79162;
    --new-bg:  #33241a;
    --d-fav:   #c9a668;
    --d-wie:   #77a9cd;
    --d-sim:   #93bd7c;

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 20px 96px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .head-inner {
    max-width: 780px; margin: 0 auto; padding: 14px 20px 12px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand {

    font-weight: 600; font-size: 21px; letter-spacing: -0.01em;
    color: var(--ink); display: flex; align-items: center; gap: 9px;
  }
  .blip {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
    flex: none;
  }
  .head-meta {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px; color: var(--muted); text-align: right;
    display: flex; flex-direction: column; gap: 1px;
    font-variant-numeric: tabular-nums;

  .head-meta b { color: var(--ink); font-weight: 500; }

  .filterline {

    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap;

  .chips { display: flex; gap: 7px; flex-wrap: wrap; padding: 16px 0 4px; }
  .chip {
    font: inherit; font-size: 12px; cursor: pointer;
    padding: 4px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .12s, color .12s, background .12s;
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }

  .chip:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .daygrp { margin-top: 30px; }
  .dayhead {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500; font-size: 15px; color: var(--muted);
    display: flex; align-items: center; gap: 10px; margin-bottom: 2px;

  .dayhead.is-new { color: var(--new); }

  .row {
    display: block; padding: 15px 0 14px;
    border-top: 1px solid var(--line);
    text-decoration: none; color: inherit;
  }
  .daygrp .row:first-of-type { border-top: none; }
  .row:hover .rtitle { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
  .row:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 5%, transparent), transparent 70%); }

  .rtop { display: flex; align-items: flex-start; gap: 12px; }
  .rtitle {
    font-weight: 600; font-size: 15px; line-height: 1.4; color: var(--ink);
    margin: 0; flex: 1; text-wrap: pretty;
  }
  .rprice {
    font-family: "IBM Plex Mono", monospace; font-weight: 500;
    font-size: 14px; color: var(--ink); white-space: nowrap;
    font-variant-numeric: tabular-nums; padding-top: 1px;
  }
  .rmeta {
    margin-top: 7px; display: flex; align-items: center; gap: 7px 12px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--muted);
  }
  .rmeta .m { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .bez { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--ink); }
  .bez .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .tag {
    font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted);
  }
  .tag.priv { border-color: color-mix(in srgb, var(--d-sim) 45%, var(--line)); color: var(--d-sim); }
  .tag.new {
    color: var(--new); border-color: color-mix(in srgb, var(--new) 45%, var(--line));
    background: var(--new-bg); font-weight: 600;
  }
  .rwhen { color: var(--faint); font-family: "IBM Plex Mono", monospace; font-size: 11.5px; margin-left: auto; }

  .empty { margin-top: 40px; text-align: center; color: var(--muted); font-size: 14px; }
  footer { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); line-height: 1.7; }

<script>
(function () {

  var TZ = "Europe/Vienna";

  var listings = Array.isArray(data.listings) ? data.listings.slice() : [];

  var BEZ = {
    "04": { name: "Wieden",     v: "--d-wie" },
    "05": { name: "Margareten", v: "--d-mar" },
    "10": { name: "Favoriten",  v: "--d-fav" },
    "11": { name: "Simmering",  v: "--d-sim" }
  };
  function bezKey(b) { return (b || "").slice(0, 2); }
  function bezName(b) {
    var k = bezKey(b);
    if (BEZ[k]) return k.replace(/^0/, "") + ". " + BEZ[k].name;
    return (b || "").trim();
  }
  function bezVar(b) { var k = bezKey(b); return BEZ[k] ? BEZ[k].v : "--muted"; }

  function dayKey(d) { return d.toLocaleDateString("en-CA", { timeZone: TZ }); }

  var lastRun = data.lastRunAt ? new Date(data.lastRunAt) : new Date(0);
  var winDays = data.windowDays || 10;
  var cutoff = Date.now() - winDays * 864e5;

  listings = listings.filter(function (x) {
    var t = Date.parse(x.firstSeen || x.published);
    return isFinite(t) && t >= cutoff;
  });
  listings.sort(function (a, b) {
    return Date.parse(b.firstSeen || b.published) - Date.parse(a.firstSeen || a.published);
  });

  var todayKey = dayKey(new Date());
  var yestKey = dayKey(new Date(Date.now() - 864e5));

  function dayLabel(key) {
    if (key === todayKey) return "Heute";
    if (key === yestKey) return "Gestern";
    var parts = key.split("-");
    var d = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2], 12));
    return d.toLocaleDateString("de-AT", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
  }
  function relTime(iso) {
    var diff = Date.now() - Date.parse(iso);
    var h = Math.floor(diff / 36e5);
    if (h < 1) return "gerade eben";
    if (h < 24) return "vor " + h + " h";
    var d = Math.floor(h / 24);
    return "vor " + d + " " + (d === 1 ? "Tag" : "Tagen");
  }
  function fmtStamp(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("de-AT", { timeZone: TZ, day: "2-digit", month: "2-digit" }) + " " +
           d.toLocaleTimeString("de-AT", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  document.getElementById("count").textContent = listings.length;
  document.getElementById("win").textContent = winDays;
  document.getElementById("stamp").textContent = data.generatedAt ? fmtStamp(data.generatedAt) : "–";
  document.getElementById("crit").textContent = (data.search && data.search.label) || "";

  var active = {};
  var order = ["10", "05", "04", "11"];
  var present = order.filter(function (k) {
    return listings.some(function (x) { return bezKey(x.bez) === k; });
  });
  var chipWrap = document.getElementById("chips");
  present.forEach(function (k) {
    active[k] = true;
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", "true");
    b.dataset.k = k;
    b.innerHTML = '<span class="dot" style="background:var(' + BEZ[k].v + ')"></span>' +
                  esc(k.replace(/^0/, "") + ". " + BEZ[k].name) + ' <span style="opacity:.6">' +
                  listings.filter(function (x) { return bezKey(x.bez) === k; }).length + '</span>';
    b.addEventListener("click", function () {
      active[k] = !active[k];
      b.setAttribute("aria-pressed", active[k] ? "true" : "false");
      render();
    });
    chipWrap.appendChild(b);
  });

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");

  function render() {
    var rows = listings.filter(function (x) { return active[bezKey(x.bez)]; });
    listEl.innerHTML = "";
    emptyEl.hidden = rows.length > 0;

    var groups = [];
    var idx = {};
    rows.forEach(function (x) {

      var dk = dayKey(new Date(x.firstSeen || x.published));
      var key = (isNew ? "NEU " : "") + dk;
      if (!(key in idx)) { idx[key] = groups.length; groups.push({ isNew: isNew, dk: dk, items: [] }); }
      groups[idx[key]].items.push(x);
    });

    groups.forEach(function (g) {
      var wrap = document.createElement("section");
      wrap.className = "daygrp";
      var h = document.createElement("h2");
      h.className = "dayhead" + (g.isNew ? " is-new" : "");
      var label = g.isNew ? "Neu · " + dayLabel(g.dk) : dayLabel(g.dk);
      h.innerHTML = esc(label) + ' <span class="n">' + g.items.length + '</span>';
      wrap.appendChild(h);

      g.items.forEach(function (x) {
        var a = document.createElement("a");
        a.className = "row";
        a.href = x.url;
        a.target = "_blank";
        a.rel = "noopener";

        var isNew = Date.parse(x.firstSeen || x.published) >= lastRun.getTime();
        a.innerHTML =

            '<p class="rtitle">' + esc(x.title) + '</p>' +
            '<span class="rprice">' + esc(x.price || "–") + '</span>' +

          '<div class="rmeta">' +
            '<span class="bez"><span class="dot" style="background:var(' + bezVar(x.bez) + ')"></span>' + esc(bezName(x.bez)) + '</span>' +
            '<span class="m">' + esc(size) + '</span>' +
            '<span class="tag ' + (x.privat ? "priv" : "") + '">' + (x.privat ? "Privat" : "Makler") + '</span>' +
            (isNew ? '<span class="tag new">Neu</span>' : '') +
            '<span class="rwhen">' + esc(relTime(x.firstSeen || x.published)) + '</span>' +
          '</div>';
        wrap.appendChild(a);
      });
      listEl.appendChild(wrap);
    });
  }

  render();

  var foot = document.getElementById("foot");
  foot.innerHTML =
    'Quelle: &ouml;ffentliche willhaben-Suche, entspricht dem Suchagenten &bdquo;Mietwohnungen&ldquo;. ' +
    'T&auml;glich aktualisiert (GitHub Actions, ~09:00 Uhr Wien). Zeitfenster ' + winDays + ' Tage, neueste zuerst. ' +
    '<a href="' + esc((data.search && data.search.url) || "#") + '" target="_blank" rel="noopener">Suche auf willhaben &ouml;ffnen</a>.';
})();
</script>
</body>
</html>
