<script>
(function () {
  "use strict";
  var TZ = "Europe/Vienna";
  var raw = document.getElementById("wh-data").textContent;
  var data;
  try { data = JSON.parse(raw); } catch (e) { data = { listings: [] }; }
  var listings = Array.isArray(data.listings) ? data.listings.slice() : [];

  var BEZ = {
    "04": { name: "Wieden",     v: "--d-wie" },
    "05": { name: "Margareten", v: "--d-mar" },
    "10": { name: "Favoriten",  v: "--d-fav" },
    "11": { name: "Simmering",  v: "--d-sim" }
  };
  function bezKey(b) { return (b || "").slice(0, 2); }
  function bezName(b) {
    var k = bezKey(b);
    if (BEZ[k]) return k.replace(/^0/, "") + ". " + BEZ[k].name;
    return (b || "").trim();
  }
  function bezVar(b) { var k = bezKey(b); return BEZ[k] ? BEZ[k].v : "--muted"; }

  function dayKey(d) { return d.toLocaleDateString("en-CA", { timeZone: TZ }); }

  var lastRun = data.lastRunAt ? new Date(data.lastRunAt) : new Date(0);
  var winDays = data.windowDays || 10;
  var cutoff = Date.now() - winDays * 864e5;

  listings = listings.filter(function (x) {
    var t = Date.parse(x.firstSeen || x.published);
    return isFinite(t) && t >= cutoff;
  });
  listings.sort(function (a, b) {
    return Date.parse(b.firstSeen || b.published) - Date.parse(a.firstSeen || a.published);
  });

  var todayKey = dayKey(new Date());
  var yestKey = dayKey(new Date(Date.now() - 864e5));

  function dayLabel(key) {
    if (key === todayKey) return "Heute";
    if (key === yestKey) return "Gestern";
    var parts = key.split("-");
    var d = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2], 12));
    return d.toLocaleDateString("de-AT", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
  }
  function relTime(iso) {
    var diff = Date.now() - Date.parse(iso);
    var h = Math.floor(diff / 36e5);
    if (h < 1) return "gerade eben";
    if (h < 24) return "vor " + h + " h";
    var d = Math.floor(h / 24);
    return "vor " + d + " " + (d === 1 ? "Tag" : "Tagen");
  }
  function fmtStamp(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("de-AT", { timeZone: TZ, day: "2-digit", month: "2-digit" }) + " " +
           d.toLocaleTimeString("de-AT", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  document.getElementById("count").textContent = listings.length;
  document.getElementById("win").textContent = winDays;
  document.getElementById("stamp").textContent = data.generatedAt ? fmtStamp(data.generatedAt) : "–";
  document.getElementById("crit").textContent = (data.search && data.search.label) || "";

  var active = {};
  var order = ["10", "05", "04", "11"];
  var present = order.filter(function (k) {
    return listings.some(function (x) { return bezKey(x.bez) === k; });
  });
  var chipWrap = document.getElementById("chips");
  present.forEach(function (k) {
    active[k] = true;
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", "true");
    b.dataset.k = k;
    b.innerHTML = '<span class="dot" style="background:var(' + BEZ[k].v + ')"></span>' +
                  esc(k.replace(/^0/, "") + ". " + BEZ[k].name) + ' <span style="opacity:.6">' +
                  listings.filter(function (x) { return bezKey(x.bez) === k; }).length + '</span>';
    b.addEventListener("click", function () {
      active[k] = !active[k];
      b.setAttribute("aria-pressed", active[k] ? "true" : "false");
      render();
    });
    chipWrap.appendChild(b);
  });

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");

  function render() {
    var rows = listings.filter(function (x) { return active[bezKey(x.bez)]; });
    listEl.innerHTML = "";
    emptyEl.hidden = rows.length > 0;

    var groups = [];
    var idx = {};
    rows.forEach(function (x) {
      var isNew = Date.parse(x.firstSeen || x.published) >= lastRun.getTime();
      var dk = dayKey(new Date(x.firstSeen || x.published));
      var key = (isNew ? "NEU " : "") + dk;
      if (!(key in idx)) { idx[key] = groups.length; groups.push({ isNew: isNew, dk: dk, items: [] }); }
      groups[idx[key]].items.push(x);
    });

    groups.forEach(function (g) {
      var wrap = document.createElement("section");
      wrap.className = "daygrp";
      var h = document.createElement("h2");
      h.className = "dayhead" + (g.isNew ? " is-new" : "");
      var label = g.isNew ? "Neu · " + dayLabel(g.dk) : dayLabel(g.dk);
      h.innerHTML = esc(label) + ' <span class="n">' + g.items.length + '</span>';
      wrap.appendChild(h);

      g.items.forEach(function (x) {
        var a = document.createElement("a");
        a.className = "row";
        a.href = x.url;
        a.target = "_blank";
        a.rel = "noopener";
        var size = x.size ? x.size + " m²" : "– m²";
        var isNew = Date.parse(x.firstSeen || x.published) >= lastRun.getTime();
        a.innerHTML =
          '<div class="rtop">' +
            '<p class="rtitle">' + esc(x.title) + '</p>' +
            '<span class="rprice">' + esc(x.price || "–") + '</span>' +
          '</div>' +
          '<div class="rmeta">' +
            '<span class="bez"><span class="dot" style="background:var(' + bezVar(x.bez) + ')"></span>' + esc(bezName(x.bez)) + '</span>' +
            '<span class="m">' + esc(size) + '</span>' +
            '<span class="tag ' + (x.privat ? "priv" : "") + '">' + (x.privat ? "Privat" : "Makler") + '</span>' +
            (isNew ? '<span class="tag new">Neu</span>' : '') +
            '<span class="rwhen">' + esc(relTime(x.firstSeen || x.published)) + '</span>' +
          '</div>';
        wrap.appendChild(a);
      });
      listEl.appendChild(wrap);
    });
  }

  render();

  var foot = document.getElementById("foot");
  foot.innerHTML =
    'Quelle: &ouml;ffentliche willhaben-Suche, entspricht dem Suchagenten &bdquo;Mietwohnungen&ldquo;. ' +
    'T&auml;glich aktualisiert (GitHub Actions, ~09:00 Uhr Wien). Zeitfenster ' + winDays + ' Tage, neueste zuerst. ' +
    '<a href="' + esc((data.search && data.search.url) || "#") + '" target="_blank" rel="noopener">Suche auf willhaben &ouml;ffnen</a>.';
})();
</script>
